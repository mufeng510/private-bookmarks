name: Release

# 推送 v* 标签（本地 pnpm release 命令或手动打标签）时触发：
# 校验版本一致性 → 构建扩展 → 创建 GitHub Release 并上传扩展 zip → Chrome Web Store（如已配置 Secrets）
# Docker 版本镜像由 docker.yml 同一标签推送触发，见 .github/workflows/docker.yml
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release + Chrome Web Store
    runs-on: ubuntu-latest
    env:
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
      CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
      CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 版本一致性检查（tag = package.json = manifest.json）
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./apps/extension/package.json').version")
          MANIFEST=$(node -p "require('./apps/extension/manifest.json').version")
          if [ "$TAG" != "$PKG" ] || [ "$PKG" != "$MANIFEST" ]; then
            echo "::error::版本不一致: tag=$TAG package.json=$PKG manifest.json=$MANIFEST"
            exit 1
          fi
          echo "版本一致性 ✓ $TAG"

      # 扩展打包依赖 shared/sync-protocol 的构建产物，先全量构建
      - name: 全量构建
        run: pnpm build

      - name: 校验 manifest
        run: node -e "const m=require('./apps/extension/dist/manifest.json'); if(m.manifest_version!==3) throw new Error('manifest_version 必须为 3'); console.log('manifest ✓', m.name, m.version)"

      - name: 打包 zip
        run: pnpm --filter @private-bookmarks/extension zip

      - name: 创建 GitHub Release 并上传扩展 zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" apps/extension/private-bookmarks-extension-v*.zip --repo "$GITHUB_REPOSITORY" --clobber
          echo "Release $GITHUB_REF_NAME 已就绪"

      - name: 上传到 Chrome Web Store
        if: env.CHROME_EXTENSION_ID != '' && env.CHROME_CLIENT_ID != '' && env.CHROME_CLIENT_SECRET != '' && env.CHROME_REFRESH_TOKEN != ''
        run: node scripts/publish-webstore.mjs upload

      - name: 发布到 Chrome Web Store
        if: env.CHROME_EXTENSION_ID != '' && env.CHROME_CLIENT_ID != '' && env.CHROME_CLIENT_SECRET != '' && env.CHROME_REFRESH_TOKEN != ''
        run: node scripts/publish-webstore.mjs publish
