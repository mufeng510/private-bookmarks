name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: 单元测试
        run: pnpm test

      - name: 构建
        run: pnpm build

      - name: 版本一致性检查（extension package.json ↔ manifest.json）
        run: |
          PKG=$(node -p "require('./apps/extension/package.json').version")
          MANIFEST=$(node -p "require('./apps/extension/manifest.json').version")
          if [ "$PKG" != "$MANIFEST" ]; then
            echo "::error::extension 版本不一致: package.json=$PKG manifest.json=$MANIFEST"
            exit 1
          fi
          echo "extension version: $PKG ✓"
